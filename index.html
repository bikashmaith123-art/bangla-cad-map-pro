<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>বাংলা CAD ম্যাপ — প্রজেক্ট ওভারলে</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#e9eef4}#map{position:absolute;inset:0}#map iframe{width:100%;height:100%;border:0}button{border:1px solid #b8c8d8;background:#fff;border-radius:9px;padding:9px 12px;font-size:14px;color:#172b40}button.primary{background:#1769aa;color:white;border-color:#1769aa}button.on{background:#1769aa;color:#fff}#upload{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;padding:12px 18px;white-space:nowrap;box-shadow:0 3px 12px #0005}#file,#projectFile{display:none}#imageLayer{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}#overlayImg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82vw;max-height:65vh;object-fit:contain;opacity:.65;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-drag:none;filter:brightness(1)}#tapCatcher{position:absolute;inset:0;z-index:12;display:none;background:transparent;touch-action:pan-x pan-y}#panel{position:absolute;z-index:25;left:8px;right:8px;bottom:8px;max-height:55vh;overflow:auto;background:#fffffff2;border:1px solid #b8c8d8;border-radius:14px;padding:10px;box-shadow:0 3px 14px #0004}#status{font-size:13px;font-weight:600;color:#26384b;margin:0 0 8px;line-height:1.4}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}label{font-size:13px;color:#43566a;display:flex;align-items:center;gap:5px}input[type=range]{width:100px}input[type=text],select{border:1px solid #b8c8d8;border-radius:8px;padding:8px;max-width:100%}.hint{font-size:12px;color:#536579}.maprow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px;border:1px solid #d4dce5;border-radius:9px;margin:5px 0}.maprow.active{border:2px solid #1769aa;background:#edf6ff}.maprow span{flex:1;min-width:100px;font-size:13px}.pin{position:absolute;width:18px;height:18px;border:3px solid white;border-radius:50%;background:#e53935;box-shadow:0 1px 6px #0009;transform:translate(-50%,-50%);z-index:15;pointer-events:none}#badge{position:absolute;z-index:24;top:60px;left:50%;transform:translateX(-50%);background:#132d48ed;color:white;border-radius:9px;padding:7px 10px;font-size:12px;display:none;white-space:nowrap}@media(max-width:600px){#panel{max-height:58vh}#upload{top:7px;font-size:14px;padding:10px 13px}}
</style></head><body>
<div id="map"><iframe title="Google Satellite Map" src="https://maps.google.com/maps?ll=22.25,87.95&z=16&t=k&output=embed&hl=bn" allowfullscreen loading="eager"></iframe></div>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple><input id="projectFile" type="file" accept="application/json,.json">
<button id="upload" class="primary">📤 ম্যাপ আপলোড</button><div id="imageLayer"><img id="overlayImg" alt="আপলোড করা ম্যাপ" style="display:none"></div><div id="tapCatcher"></div><div id="badge"></div>
<div id="panel"><p id="status">প্রথমে একটি প্রজেক্টের নাম দিন, তারপর ম্যাপ আপলোড করুন।</p>
<div class="row"><input id="projectName" type="text" placeholder="প্রজেক্টের নাম" style="flex:1;min-width:130px"><button id="newProject">＋ নতুন প্রজেক্ট</button><button id="saveProject" class="primary">💾 প্রজেক্ট সেভ</button></div>
<div class="row"><select id="projectSelect" style="flex:1;min-width:140px"><option value="">সেভ করা প্রজেক্ট বাছুন</option></select><button id="openProject">📂 খুলুন</button><button id="exportProject">⬇ ব্যাকআপ</button><button id="importProject">⬆ ব্যাকআপ খুলুন</button></div>
<div class="row"><button id="addMaps" class="primary">📤 একসঙ্গে অনেক ম্যাপ যোগ</button><span class="hint" id="count">ম্যাপ: ০</span></div>
<div id="mapList"></div>
<div id="selectedTools" style="display:none;border-top:1px solid #d5e0ea;padding-top:7px">
<div class="row"><b id="selectedTitle">নির্বাচিত ম্যাপ</b><button id="renameMap">✏️ নাম বদল</button><button id="deleteMap">🗑️ ডিলিট</button></div>
<div class="row"><button id="align" class="primary">🎯 দুই পয়েন্টে অ্যালাইন</button><button id="cancelAlign">বাতিল</button><button id="resetView">ছবি রিসেট</button></div>
<div class="row"><label>স্বচ্ছতা <input id="opacity" type="range" min="5" max="100" value="65"><output id="opVal">৬৫%</output></label><label>উজ্জ্বলতা <input id="brightness" type="range" min="30" max="200" value="100"><output id="brVal">১০০%</output></label></div>
<div class="row"><button id="whiteBrush">⬜ সাদা অংশ ক্লিয়ার</button><button id="darkBrush">⚫ কালো দাগ ক্লিয়ার</button><button id="brushOff">✋ ব্রাশ বন্ধ</button><label>ব্রাশ <input id="brushSize" type="range" min="6" max="120" value="28"></label></div>
<div class="hint" id="cleanStatus">সাদা বা কালো ব্রাশ বেছে ছবির ওপর আঙুল টানুন। পরিবর্তন শুধু নির্বাচিত ফাইলেই থাকবে।</div>
</div><div class="hint">প্রজেক্ট এই ব্রাউজারের IndexedDB-তে সেভ হবে। অন্য ডিভাইসে নিতে “ব্যাকআপ” ডাউনলোড করে রাখুন।</div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),img=$('overlayImg'),file=$('file'),status=$('status'),catcher=$('tapCatcher'),badge=$('badge');
const DB='BanglaCADOverlayProjects',STORE='projects';let db,maps=[],selected=-1,projectId='',phase='idle',imgPts=[],mapPts=[],pins=[],brush='',drawing=false,last=null,editCanvas=document.createElement('canvas'),editCtx=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}function req(mode,fn){return new Promise((res,rej)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE),r=fn(s);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}const allProjects=()=>req('readonly',s=>s.getAll());
function refreshProjects(){allProjects().then(a=>{$('projectSelect').innerHTML='<option value="">সেভ করা প্রজেক্ট বাছুন</option>'+a.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')})}
function initEdit(data){editCanvas.width=data.width;editCanvas.height=data.height;editCtx=editCanvas.getContext('2d',{willReadFrequently:true});editCtx.drawImage(data,0,0);return editCanvas.toDataURL('image/png')}
function showMap(i){selected=i;const m=maps[i];if(!m){img.style.display='none';$('selectedTools').style.display='none';renderList();return}img.onload=()=>{editCanvas.width=img.naturalWidth;editCanvas.height=img.naturalHeight;editCtx=editCanvas.getContext('2d',{willReadFrequently:true});editCtx.drawImage(img,0,0);applySettings();};img.src=m.data;img.style.display='block';$('selectedTools').style.display='block';$('selectedTitle').textContent=`Map ${String(m.serial).padStart(3,'0')} — ${m.name}`;$('opacity').value=m.opacity??65;$('brightness').value=m.brightness??100;applySettings();renderList()}
function applySettings(){if(selected<0)return;const m=maps[selected];img.style.opacity=(m.opacity??65)/100;img.style.filter=`brightness(${(m.brightness??100)/100})`;img.style.left=(m.left||50)+'%';img.style.top=(m.top||50)+'%';img.style.width=m.width||'auto';img.style.maxWidth=m.maxWidth||'82vw';img.style.maxHeight=m.maxHeight||'65vh';img.style.transform=m.transform||'translate(-50%,-50%)';}
function renderList(){$('count').textContent='ম্যাপ: '+maps.length;$('mapList').innerHTML=maps.map((m,i)=>`<div class="maprow ${i===selected?'active':''}"><span><b>${String(m.serial).padStart(3,'0')} — ${esc(m.name)}</b><br><small>${esc(m.fileName||'ছবি')}</small></span><button data-sel="${i}">খুলুন</button><button data-up="${i}">↑</button><button data-down="${i}">↓</button></div>`).join('');$('mapList').querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>showMap(+b.dataset.sel));$('mapList').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveMap(+b.dataset.up,-1));$('mapList').querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveMap(+b.dataset.down,1))}
function moveMap(i,d){const j=i+d;if(j<0||j>=maps.length)return;[maps[i],maps[j]]=[maps[j],maps[i]];maps.forEach((m,k)=>m.serial=k+1);showMap(j)}
$('upload').onclick=$('addMaps').onclick=()=>file.click();file.onchange=async()=>{const fs=[...file.files||[]];if(!fs.length)return;for(const f of fs){if(!/^image\/(jpeg|png|webp)$/.test(f.type))continue;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});maps.push({id:uid(),serial:maps.length+1,name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,data,opacity:65,brightness:100,left:50,top:50,transform:'translate(-50%,-50%)',width:'auto',maxWidth:'82vw',maxHeight:'65vh'});}if(maps.length){$('projectName').value=$('projectName').value||'নতুন প্রজেক্ট';showMap(maps.length-1);status.textContent=fs.length+'টি ফাইল যোগ হয়েছে। তালিকা থেকে একটি বেছে তার আলাদা সেটিং করুন।'}file.value=''};
$('newProject').onclick=()=>{maps=[];selected=-1;projectId=uid();$('projectName').value='';showMap(-1);status.textContent='নতুন প্রজেক্ট তৈরি হয়েছে। নাম লিখে ম্যাপ আপলোড করুন।'};
$('saveProject').onclick=async()=>{try{if(!maps.length){status.textContent='সেভ করার আগে অন্তত একটি ম্যাপ আপলোড করুন।';return}const name=$('projectName').value.trim()||'নামহীন প্রজেক্ট';projectId=projectId||uid();const p={id:projectId,name,updated:Date.now(),maps};await req('readwrite',s=>s.put(p));refreshProjects();status.textContent=`“${name}” প্রজেক্টে ${maps.length}টি ম্যাপ ও প্রতিটির আলাদা ক্লিয়ারেন্স/স্বচ্ছতা/উজ্জ্বলতা সেভ হয়েছে।`}catch(e){status.textContent='সেভ করা যায়নি: '+e.message+'। জায়গা কম থাকলে কম ছবি দিয়ে চেষ্টা করুন।'}};
$('openProject').onclick=async()=>{const id=$('projectSelect').value;if(!id)return;const p=await req('readonly',s=>s.get(id));if(!p)return;projectId=p.id;$('projectName').value=p.name;maps=p.maps||[];selected=maps.length?0:-1;showMap(selected);status.textContent=`${p.name} প্রজেক্ট খোলা হয়েছে — ${maps.length}টি ম্যাপ।`};
$('exportProject').onclick=()=>{if(!maps.length){status.textContent='আগে প্রজেক্টে ম্যাপ যোগ করুন।';return}const p={format:'BanglaCADOverlayProject',version:1,name:$('projectName').value||'প্রজেক্ট',maps};const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(p)],{type:'application/json'}));a.href=u;a.download=(p.name.replace(/[^\p{L}\p{N}_-]+/gu,'_')||'project')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('importProject').onclick=()=>$('projectFile').click();$('projectFile').onchange=async()=>{const f=$('projectFile').files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.format!=='BanglaCADOverlayProject'||!Array.isArray(p.maps))throw Error('ভুল প্রজেক্ট ফাইল');maps=p.maps;maps.forEach((m,i)=>m.serial=i+1);projectId=uid();$('projectName').value=p.name||f.name;showMap(maps.length?0:-1);status.textContent='ব্যাকআপ প্রজেক্ট খোলা হয়েছে। চাইলে “প্রজেক্ট সেভ” চাপুন।'}catch(e){status.textContent='প্রজেক্ট খোলা যায়নি: '+e.message} $('projectFile').value=''};
$('renameMap').onclick=()=>{if(selected<0)return;const n=prompt('এই ম্যাপের নতুন নাম লিখুন',maps[selected].name);if(n&&n.trim()){maps[selected].name=n.trim();$('selectedTitle').textContent=`Map ${String(maps[selected].serial).padStart(3,'0')} — ${n.trim()}`;renderList()}};
$('deleteMap').onclick=()=>{if(selected<0)return;if(!confirm('এই ম্যাপটি প্রজেক্ট থেকে ডিলিট করবেন?'))return;maps.splice(selected,1);maps.forEach((m,i)=>m.serial=i+1);showMap(maps.length?Math.min(selected,maps.length-1):-1)};
$('opacity').oninput=()=>{if(selected<0)return;maps[selected].opacity=+$('opacity').value;img.style.opacity=maps[selected].opacity/100;$('opVal').value=maps[selected].opacity+'%'};$('brightness').oninput=()=>{if(selected<0)return;maps[selected].brightness=+$('brightness').value;img.style.filter=`brightness(${maps[selected].brightness/100})`;$('brVal').value=maps[selected].brightness+'%'};
function setBrush(v){brush=v;phase='idle';$('whiteBrush').classList.toggle('on',v==='white');$('darkBrush').classList.toggle('on',v==='dark');$('brushOff').classList.toggle('on',!v);$('cleanStatus').textContent=v==='white'?'সাদা/হালকা অংশে আঙুল টানুন।':'কালো/গাঢ় দাগের ওপর আঙুল টানুন।'}$('whiteBrush').onclick=()=>setBrush('white');$('darkBrush').onclick=()=>setBrush('dark');$('brushOff').onclick=()=>setBrush('');
function cleanAt(x,y){if(!editCtx||selected<0||!brush)return;const r=img.getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)return;const sx=editCanvas.width/r.width,sy=editCanvas.height/r.height,cx=(x-r.left)*sx,cy=(y-r.top)*sy,rad=(+$('brushSize').value)/2*(sx+sy)/2,x0=Math.max(0,Math.floor(cx-rad)),y0=Math.max(0,Math.floor(cy-rad)),x1=Math.min(editCanvas.width,Math.ceil(cx+rad)),y1=Math.min(editCanvas.height,Math.ceil(cy+rad));if(x1<=x0||y1<=y0)return;const d=editCtx.getImageData(x0,y0,x1-x0,y1-y0),a=d.data;let n=0;for(let yy=0;yy<d.height;yy++)for(let xx=0;xx<d.width;xx++){const dx=x0+xx-cx,dy=y0+yy-cy;if(dx*dx+dy*dy>rad*rad)continue;const k=(yy*d.width+xx)*4,R=a[k],G=a[k+1],B=a[k+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B),lum=(R+G+B)/3,hit=brush==='white'?(lum>190&&mx-mn<65):(lum<90&&mx-mn<85);if(hit&&a[k+3]){a[k+3]=0;n++}}editCtx.putImageData(d,x0,y0);if(n){img.src=editCanvas.toDataURL('image/png');maps[selected].data=img.src;maps[selected].cleaned=true;$('cleanStatus').textContent=n+'টি পিক্সেল স্বচ্ছ করা হয়েছে।'}else $('cleanStatus').textContent='ব্রাশের রঙের সীমায় পিক্সেল মেলেনি; সাইজ বাড়িয়ে চেষ্টা করুন।'}
img.addEventListener('pointerdown',e=>{if(!brush)return;e.preventDefault();e.stopImmediatePropagation();drawing=true;last={x:e.clientX,y:e.clientY};cleanAt(e.clientX,e.clientY);img.setPointerCapture(e.pointerId)},true);img.addEventListener('pointermove',e=>{if(!drawing||!brush)return;const dx=e.clientX-last.x,dy=e.clientY-last.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));for(let i=1;i<=n;i++)cleanAt(last.x+dx*i/n,last.y+dy*i/n);last={x:e.clientX,y:e.clientY}},true);function stopDraw(){drawing=false;last=null;if(selected>=0&&editCanvas.width)maps[selected].data=editCanvas.toDataURL('image/png')}img.addEventListener('pointerup',stopDraw,true);img.addEventListener('pointercancel',stopDraw,true);
$('align').onclick=()=>{setBrush('');if(selected<0)return;phase='image';imgPts=[];mapPts=[];pins.forEach(p=>p.remove());pins=[];catcher.style.display='none';badge.style.display='block';badge.textContent='১/৪ — ছবির A পয়েন্টে টাচ করুন';status.textContent='ছবির A পয়েন্টে টাচ → ম্যাপের একই A → ছবির B → ম্যাপের একই B।'};img.addEventListener('pointerdown',e=>{if(phase!=='image')return;e.preventDefault();const r=img.getBoundingClientRect();imgPts.push({u:(e.clientX-r.left)/r.width,v:(e.clientY-r.top)/r.height,x:e.clientX,y:e.clientY});pin(e.clientX,e.clientY);if(imgPts.length===1){phase='map';catcher.style.display='block';badge.textContent='২/৪ — Google Map-এ একই A পয়েন্টে টাচ করুন'}else{phase='map';catcher.style.display='block';badge.textContent='৪/৪ — Google Map-এ একই B পয়েন্টে টাচ করুন'}},true);
function pin(x,y){const p=document.createElement('i');p.className='pin';p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);pins.push(p)}catcher.addEventListener('pointerdown',e=>{if(phase!=='map')return;e.preventDefault();mapPts.push({x:e.clientX,y:e.clientY});pin(e.clientX,e.clientY);catcher.style.display='none';if(mapPts.length===1){phase='image';badge.textContent='৩/৪ — ছবির B পয়েন্টে টাচ করুন'}else{phase='done';badge.style.display='none';alignImage();status.textContent='দুই-পয়েন্ট অ্যালাইনমেন্ট সম্পন্ন। এই স্ক্রিনে সেট করা হয়েছে।'} });
function alignImage(){const a=imgPts[0],b=imgPts[1],A=mapPts[0],B=mapPts[1],r=img.getBoundingClientRect(),p1={x:r.left+a.u*r.width,y:r.top+a.v*r.height},p2={x:r.left+b.u*r.width,y:r.top+b.v*r.height},vx=p2.x-p1.x,vy=p2.y-p1.y,wx=B.x-A.x,wy=B.y-A.y,s=Math.hypot(wx,wy)/Math.max(1,Math.hypot(vx,vy)),ang=Math.atan2(wy,wx)-Math.atan2(vy,vx),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=A.x-(cx+(p1.x-cx)*s*Math.cos(ang)-(p1.y-cy)*s*Math.sin(ang)),dy=A.y-(cy+(p1.x-cx)*s*Math.sin(ang)+(p1.y-cy)*s*Math.cos(ang));img.style.transition='transform .15s';img.style.width=(r.width*s)+'px';img.style.maxWidth='none';img.style.maxHeight='none';img.style.left=(cx+dx)+'px';img.style.top=(cy+dy)+'px';img.style.transform=`translate(-50%,-50%) rotate(${ang*180/Math.PI}deg)`;const m=maps[selected];m.left=((cx+dx)/innerWidth*100);m.top=((cy+dy)/innerHeight*100);m.width=img.style.width;m.maxWidth='none';m.maxHeight='none';m.transform=img.style.transform;m.aligned=true;}
$('cancelAlign').onclick=()=>{phase='idle';catcher.style.display='none';badge.style.display='none';status.textContent='অ্যালাইনমেন্ট বন্ধ করা হয়েছে।'};$('resetView').onclick=()=>{if(selected<0)return;const m=maps[selected];m.left=50;m.top=50;m.width='auto';m.maxWidth='82vw';m.maxHeight='65vh';m.transform='translate(-50%,-50%)';m.aligned=false;applySettings()};
openDB().then(refreshProjects).catch(e=>status.textContent='এই ব্রাউজারে প্রজেক্ট স্টোরেজ চালু হয়নি: '+e.message);
})();
